name: Deploy to GitHub Pages

# main 에 푸시하면 자동 빌드 후 GitHub Pages 로 배포.
# (저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 설정해두면 됨)
# ※ 지도(VWorld)는 배포 도메인(예: minyoungkyu.github.io)이 VWorld 콘솔에
#    등록돼 있어야 타일이 뜬다 (Referer 도메인 검증).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
